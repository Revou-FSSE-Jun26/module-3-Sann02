<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RevoShop — Typed Product Catalog</title>
    <link rel="stylesheet" href="./dist/output.css" />
  </head>
  <body class="min-h-screen bg-gray-100 text-gray-900">
    <header class="border-b border-gray-200 bg-white">
      <div
        class="mx-auto flex max-w-5xl items-center justify-between gap-4 px-4 py-4"
      >
        <h1 class="text-xl font-bold text-blue-600">RevoShop</h1>
        <div class="flex items-center gap-2 text-sm font-semibold">
          <span>🛒 Cart:</span>
          <span
            id="cart-count"
            class="inline-flex min-w-[1.5rem] justify-center rounded-full bg-blue-600 px-2 py-0.5 text-white"
            >0</span
          >
        </div>
      </div>
    </header>

    <main class="mx-auto max-w-5xl px-4 py-6">
      <div class="mb-6">
        <label for="search" class="mb-1 block text-sm font-semibold"
          >Search products</label
        >
        <input
          id="search"
          type="search"
          placeholder="Try 'keyboard', 'bluetooth', 'fitness'..."
          class="w-full rounded-lg border border-gray-300 px-3 py-2 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200"
        />
      </div>

      <!-- Mobile-first responsive grid: 1 col -> 2 (sm) -> 3 (lg) -->
      <div
        id="product-grid"
        class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3"
      ></div>

      <p id="empty-state" class="hidden py-12 text-center text-gray-500">
        No products match your search.
      </p>
    </main>

    <footer class="mx-auto max-w-5xl px-4 py-6 text-center text-sm text-gray-500">
      &copy; 2026 M Ikhsan Febrian — RevoShop fundamentals
    </footer>

    <!-- Compiled from src/main.ts by tsc -->
    <script type="module" src="./dist/main.js"></script>
  </body>
</html>
